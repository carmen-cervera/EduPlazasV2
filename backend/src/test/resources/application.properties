# Base de datos H2 en memoria para tests (evita conflictos con el fichero de producción)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración de email con valores ficticios (el bean JavaMailSender se mockea en los tests de sistema)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Puerto fijo para que el frontend (http://localhost:8080) encuentre el backend
server.port=8080
